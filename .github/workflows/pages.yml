name: Build and deploy course materials to Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install marp-cli
        run: npm install -g @marp-team/marp-cli@4.5.0

      - name: Install pandoc, PlantUML, librsvg, TeX Live, and emoji/DejaVu fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc plantuml librsvg2-bin \
            fonts-dejavu fonts-dejavu-extra fonts-symbola \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-luatex texlive-plain-generic

      - name: Set up the Python venv used by the rendering scripts
        run: |
          python3 -m venv scripts/.venv
          scripts/.venv/bin/pip install --quiet --upgrade pip pygments pillow

      - name: Build all slide and jobsheet PDFs
        run: ./scripts/render-all.sh

      - name: Package Bank Mini checkpoints as downloadable zips
        run: python3 scripts/gen-checkpoint-zips.py

      - name: Assemble the Pages site
        run: python3 scripts/gen-pages-index.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
