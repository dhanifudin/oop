name: Build and deploy course materials to Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install marp-cli
        run: npm install -g @marp-team/marp-cli@4.5.0

      - name: Install Homebrew packages (pandoc, PlantUML, librsvg)
        run: brew install pandoc plantuml librsvg

      - name: Install TeX Live (mactex-no-gui, provides lualatex)
        run: |
          brew install --cask mactex-no-gui
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"

      - name: Install fonts used by jobsheet PDFs (DejaVu Sans, Symbola emoji fallback)
        run: brew install --cask font-dejavu font-symbola

      - name: Set up the Python venv used by the rendering scripts
        run: |
          python3 -m venv scripts/.venv
          scripts/.venv/bin/pip install --quiet --upgrade pip pygments pillow

      - name: Verify toolchain
        run: |
          marp --version
          pandoc --version
          lualatex --version
          plantuml --version
          rsvg-convert --version

      - name: Build all slide and jobsheet PDFs
        run: ./scripts/render-all.sh

      - name: Assemble the Pages site
        run: python3 scripts/gen-pages-index.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
