<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowBlue4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- the single call site -->
  <g filter="url(#softShadow)">
    <rect x="270" y="20" width="300" height="70" rx="14" fill="#1d4ed8"/>
  </g>
  <text x="420" y="48" text-anchor="middle" font-size="19.8" font-weight="700" fill="#ffffff">for (Shape s : shapes)</text>
  <text x="420" y="74" text-anchor="middle" font-size="19.8" font-weight="700" fill="#ffffff">s.area()</text>

  <!-- array holding two different concrete types under one Shape reference -->
  <rect x="130" y="140" width="580" height="110" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="420" y="128" text-anchor="middle" font-size="16.2" fill="#64748b">shapes : Shape[]</text>

  <rect x="165" y="165" width="220" height="60" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="275" y="188" text-anchor="middle" font-size="17.6" font-weight="700" fill="#1d4ed8">[0] Circle</text>
  <text x="275" y="210" text-anchor="middle" font-size="15.4" fill="#64748b">radius = 3</text>

  <rect x="455" y="165" width="220" height="60" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="565" y="188" text-anchor="middle" font-size="17.6" font-weight="700" fill="#1d4ed8">[1] Square</text>
  <text x="565" y="210" text-anchor="middle" font-size="15.4" fill="#64748b">side = 4</text>

  <!-- arrows: call site down to each slot -->
  <path d="M370,92 C320,115 290,135 275,163" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowBlue4)"/>
  <path d="M470,92 C530,115 555,135 565,163" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowBlue4)"/>

  <!-- each slot resolves, at runtime, to its OWN area() implementation -->
  <path d="M275,227 L275,278" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6,5" marker-end="url(#arrowBlue4)"/>
  <path d="M565,227 L565,278" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6,5" marker-end="url(#arrowBlue4)"/>

  <g filter="url(#softShadow)">
    <rect x="150" y="283" width="250" height="100" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2"/>
  </g>
  <text x="275" y="308" text-anchor="middle" font-size="16.9" font-weight="700" fill="#166534">Circle.area()</text>
  <text x="275" y="332" text-anchor="middle" font-size="15.4" fill="#166534">3.14 &#215; radius&#178;</text>
  <text x="275" y="358" text-anchor="middle" font-size="15.4" fill="#166534">= 28.3</text>

  <g filter="url(#softShadow)">
    <rect x="440" y="283" width="250" height="100" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2"/>
  </g>
  <text x="565" y="308" text-anchor="middle" font-size="16.9" font-weight="700" fill="#166534">Square.area()</text>
  <text x="565" y="332" text-anchor="middle" font-size="15.4" fill="#166534">side &#215; side</text>
  <text x="565" y="358" text-anchor="middle" font-size="15.4" fill="#166534">= 16</text>

  <text x="420" y="418" text-anchor="middle" font-size="16.9" fill="#94a3b8">one call site, s.area(), resolves differently</text>
  <text x="420" y="442" text-anchor="middle" font-size="16.9" fill="#94a3b8">depending on the object&#8217;s actual type at runtime</text>
</svg>
