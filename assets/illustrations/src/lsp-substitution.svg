<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowBlue7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowGreen7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowRed7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- the single call site -->
  <g filter="url(#softShadow)">
    <rect x="280" y="20" width="340" height="70" rx="14" fill="#1d4ed8"/>
  </g>
  <text x="450" y="48" text-anchor="middle" font-size="18.5" font-weight="700" fill="#ffffff">for (Bird b : birds)</text>
  <text x="450" y="74" text-anchor="middle" font-size="18.5" font-weight="700" fill="#ffffff">b.fly()</text>

  <path d="M370,92 C300,120 220,140 175,163" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowBlue7)"/>
  <path d="M450,92 L450,163" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowBlue7)"/>
  <path d="M530,92 C600,120 680,140 725,163" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowBlue7)"/>

  <rect x="90" y="168" width="170" height="50" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="175" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">Sparrow</text>

  <rect x="365" y="168" width="170" height="50" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="450" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">Duck</text>

  <rect x="640" y="168" width="170" height="50" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="725" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">Penguin</text>

  <path d="M175,222 L175,268" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6,5" marker-end="url(#arrowGreen7)"/>
  <path d="M450,222 L450,268" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6,5" marker-end="url(#arrowGreen7)"/>
  <path d="M725,222 L725,268" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,5" marker-end="url(#arrowRed7)"/>

  <g filter="url(#softShadow)">
    <rect x="90" y="273" width="170" height="75" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2"/>
  </g>
  <text x="175" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">flies</text>
  <text x="175" y="328" text-anchor="middle" font-size="13" fill="#166534">successfully</text>

  <g filter="url(#softShadow)">
    <rect x="365" y="273" width="170" height="75" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2"/>
  </g>
  <text x="450" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">flies</text>
  <text x="450" y="328" text-anchor="middle" font-size="13" fill="#166534">successfully</text>

  <g filter="url(#softShadow)">
    <rect x="640" y="273" width="170" height="75" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.4"/>
  </g>
  <text x="725" y="303" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">throws</text>
  <text x="725" y="323" text-anchor="middle" font-size="12" fill="#991b1b">UnsupportedOperation</text>
  <text x="725" y="339" text-anchor="middle" font-size="12" fill="#991b1b">Exception</text>

  <text x="450" y="405" text-anchor="middle" font-size="16.9" fill="#94a3b8">Penguin cannot substitute for Bird here,</text>
  <text x="450" y="428" text-anchor="middle" font-size="16.9" fill="#94a3b8">it breaks a call site that works for every other subclass</text>
</svg>
