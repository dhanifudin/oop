<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- incoming value, valid -->
  <rect x="10" y="60" width="220" height="50" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="120" y="90" text-anchor="middle" font-size="16" fill="#166534">setTemperature(22)</text>

  <!-- incoming value, invalid -->
  <rect x="10" y="250" width="220" height="50" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="120" y="280" text-anchor="middle" font-size="16" fill="#991b1b">setTemperature(-50)</text>

  <!-- the gate -->
  <g filter="url(#softShadow)">
    <rect x="300" y="60" width="200" height="240" rx="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
  </g>
  <text x="400" y="95" text-anchor="middle" font-size="20.2" font-weight="700" fill="#1d4ed8">setter</text>
  <path d="M340,130 h120 v20 l-30,30 h-60 l-30,-30 z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="400" y="150" text-anchor="middle" font-size="16.2" fill="#1d4ed8">is it within</text>
  <text x="400" y="166" text-anchor="middle" font-size="16.2" fill="#1d4ed8">16-30?</text>

  <path d="M230,85 C260,85 275,90 300,110" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M230,275 C260,275 275,220 300,180" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>

  <!-- stored field -->
  <rect x="360" y="220" width="80" height="50" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="400" y="240" text-anchor="middle" font-size="14.9" fill="#64748b">temperature</text>
  <text x="400" y="257" text-anchor="middle" font-size="17.6" fill="#1d4ed8" font-weight="700">field</text>

  <path d="M400,196 L400,216" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- outcomes -->
  <rect x="600" y="65" width="170" height="45" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="685" y="93" text-anchor="middle" font-size="17.6" fill="#166534">stored as 22</text>
  <path d="M500,90 L595,88" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <rect x="600" y="255" width="170" height="45" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="685" y="277" text-anchor="middle" font-size="17.6" fill="#991b1b">clamped to 16</text>
  <path d="M500,270 L595,278" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>

  <text x="400" y="335" text-anchor="middle" font-size="18.9" fill="#1d4ed8" font-weight="600">the setter checks every value before it is ever stored</text>
</svg>
