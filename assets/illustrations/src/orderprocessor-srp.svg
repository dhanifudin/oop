<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowBlue9" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <g filter="url(#softShadow)">
    <rect x="270" y="15" width="360" height="70" rx="14" fill="#1d4ed8"/>
  </g>
  <text x="450" y="42" text-anchor="middle" font-size="18.5" font-weight="700" fill="#ffffff">OrderProcessor</text>
  <text x="450" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">processOrder(customer, order)</text>

  <path d="M370,87 C300,113 220,133 175,158" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrowBlue9)"/>
  <path d="M450,87 L450,158" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrowBlue9)"/>
  <path d="M530,87 C600,113 680,133 725,158" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrowBlue9)"/>

  <rect x="90" y="163" width="170" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2"/>
  <text x="175" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">DiscountCalculator</text>
  <text x="175" y="215" text-anchor="middle" font-size="12.5" fill="#166534">menghitung diskon</text>

  <rect x="365" y="163" width="170" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2"/>
  <text x="450" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Repository</text>
  <text x="450" y="215" text-anchor="middle" font-size="12.5" fill="#166534">menyimpan pesanan</text>

  <rect x="640" y="163" width="170" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2"/>
  <text x="725" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">ReceiptPrinter</text>
  <text x="725" y="215" text-anchor="middle" font-size="12.5" fill="#166534">mencetak struk</text>

  <text x="450" y="290" text-anchor="middle" font-size="16.5" fill="#94a3b8">OrderProcessor hanya mengoordinasikan,</text>
  <text x="450" y="313" text-anchor="middle" font-size="16.5" fill="#94a3b8">tiap tanggung jawab didelegasikan ke kelasnya sendiri</text>
</svg>
