<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- dependency -->
  <g filter="url(#softShadow)">
    <rect x="40" y="40" width="195" height="260" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="137.5" y="75" text-anchor="middle" font-size="21.6" font-weight="700" fill="#1d4ed8">dependency</text>

  <rect x="58" y="120" width="70" height="46" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="93" y="147" text-anchor="middle" font-size="16.2" fill="#1d4ed8">Printer</text>
  <line x1="128" y1="143" x2="147" y2="143" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5,4"/>
  <rect x="147" y="120" width="70" height="46" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="182" y="147" text-anchor="middle" font-size="16.2" fill="#1d4ed8">File</text>

  <text x="137.5" y="230" text-anchor="middle" font-size="16.2" fill="#64748b">weakest link:</text>
  <text x="137.5" y="248" text-anchor="middle" font-size="16.2" fill="#64748b">used briefly,</text>
  <text x="137.5" y="264" text-anchor="middle" font-size="16.2" fill="#64748b">never stored</text>

  <!-- association -->
  <g filter="url(#softShadow)">
    <rect x="255" y="40" width="195" height="260" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="352.5" y="75" text-anchor="middle" font-size="21.6" font-weight="700" fill="#1d4ed8">association</text>

  <rect x="273" y="120" width="70" height="46" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="308" y="147" text-anchor="middle" font-size="16.2" fill="#1d4ed8">Driver</text>
  <line x1="343" y1="143" x2="362" y2="143" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="362" y="120" width="70" height="46" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="397" y="147" text-anchor="middle" font-size="16.2" fill="#1d4ed8">Car</text>

  <text x="352.5" y="230" text-anchor="middle" font-size="16.2" fill="#64748b">stored, but</text>
  <text x="352.5" y="248" text-anchor="middle" font-size="16.2" fill="#64748b">both exist</text>
  <text x="352.5" y="264" text-anchor="middle" font-size="16.2" fill="#64748b">independently</text>

  <!-- aggregation -->
  <g filter="url(#softShadow)">
    <rect x="470" y="40" width="195" height="260" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="567.5" y="75" text-anchor="middle" font-size="21.6" font-weight="700" fill="#1d4ed8">aggregation</text>

  <rect x="488" y="120" width="70" height="46" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="523" y="147" text-anchor="middle" font-size="16.2" fill="#1d4ed8">Library</text>
  <path d="M558,143 L561,143" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M561,143 l6.5,-6 6.5,6 -6.5,6 z" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M574,143 L577,143" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="577" y="120" width="70" height="46" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="612" y="147" text-anchor="middle" font-size="16.2" fill="#1d4ed8">Book</text>

  <text x="567.5" y="230" text-anchor="middle" font-size="16.2" fill="#64748b">whole holds part,</text>
  <text x="567.5" y="248" text-anchor="middle" font-size="16.2" fill="#64748b">but part can</text>
  <text x="567.5" y="264" text-anchor="middle" font-size="16.2" fill="#64748b">outlive the whole</text>

  <!-- composition -->
  <g filter="url(#softShadow)">
    <rect x="685" y="40" width="195" height="260" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="782.5" y="75" text-anchor="middle" font-size="21.6" font-weight="700" fill="#1d4ed8">composition</text>

  <rect x="703" y="120" width="70" height="46" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="738" y="147" text-anchor="middle" font-size="16.2" fill="#1d4ed8">Car</text>
  <path d="M773,143 L776,143" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M776,143 l6.5,-6 6.5,6 -6.5,6 z" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M789,143 L792,143" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="792" y="120" width="70" height="46" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="827" y="147" text-anchor="middle" font-size="16.2" fill="#1d4ed8">Engine</text>

  <text x="782.5" y="230" text-anchor="middle" font-size="16.2" fill="#64748b">strongest link:</text>
  <text x="782.5" y="248" text-anchor="middle" font-size="16.2" fill="#64748b">part's lifetime is</text>
  <text x="782.5" y="264" text-anchor="middle" font-size="16.2" fill="#64748b">tied to the whole</text>

  <text x="460" y="325" text-anchor="middle" font-size="18.9" fill="#1d4ed8" font-weight="600">four strengths of class relations, weakest to strongest</text>
</svg>
