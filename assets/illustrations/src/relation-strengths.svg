<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- dependency -->
  <g filter="url(#softShadow)">
    <rect x="40" y="40" width="210" height="260" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="145" y="75" text-anchor="middle" font-size="21.6" font-weight="700" fill="#1d4ed8">dependency</text>

  <rect x="58" y="120" width="70" height="46" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="93" y="147" text-anchor="middle" font-size="16.2" fill="#1d4ed8">Printer</text>
  <line x1="128" y1="143" x2="162" y2="143" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5,4"/>
  <rect x="162" y="120" width="70" height="46" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="197" y="147" text-anchor="middle" font-size="16.2" fill="#1d4ed8">File</text>

  <text x="145" y="230" text-anchor="middle" font-size="16.2" fill="#64748b">weakest link:</text>
  <text x="145" y="248" text-anchor="middle" font-size="16.2" fill="#64748b">used briefly,</text>
  <text x="145" y="264" text-anchor="middle" font-size="16.2" fill="#64748b">never stored</text>

  <!-- association -->
  <g filter="url(#softShadow)">
    <rect x="270" y="40" width="210" height="260" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="375" y="75" text-anchor="middle" font-size="21.6" font-weight="700" fill="#1d4ed8">association</text>

  <rect x="288" y="120" width="70" height="46" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="323" y="147" text-anchor="middle" font-size="16.2" fill="#1d4ed8">Driver</text>
  <line x1="358" y1="143" x2="392" y2="143" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="392" y="120" width="70" height="46" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="427" y="147" text-anchor="middle" font-size="16.2" fill="#1d4ed8">Car</text>

  <text x="375" y="230" text-anchor="middle" font-size="16.2" fill="#64748b">stored, but</text>
  <text x="375" y="248" text-anchor="middle" font-size="16.2" fill="#64748b">both exist</text>
  <text x="375" y="264" text-anchor="middle" font-size="16.2" fill="#64748b">independently</text>

  <!-- aggregation -->
  <g filter="url(#softShadow)">
    <rect x="500" y="40" width="210" height="260" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="605" y="75" text-anchor="middle" font-size="21.6" font-weight="700" fill="#1d4ed8">aggregation</text>

  <rect x="518" y="120" width="70" height="46" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="553" y="147" text-anchor="middle" font-size="16.2" fill="#1d4ed8">Library</text>
  <path d="M588,143 L592,143" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M592,143 l13,-11 13,11 -13,11 z" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <path d="M618,143 L622,143" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="622" y="120" width="70" height="46" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="657" y="147" text-anchor="middle" font-size="16.2" fill="#1d4ed8">Book</text>

  <text x="605" y="230" text-anchor="middle" font-size="16.2" fill="#64748b">whole holds part,</text>
  <text x="605" y="248" text-anchor="middle" font-size="16.2" fill="#64748b">but part can</text>
  <text x="605" y="264" text-anchor="middle" font-size="16.2" fill="#64748b">outlive the whole</text>

  <!-- composition -->
  <g filter="url(#softShadow)">
    <rect x="730" y="40" width="210" height="260" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="835" y="75" text-anchor="middle" font-size="21.6" font-weight="700" fill="#1d4ed8">composition</text>

  <rect x="748" y="120" width="70" height="46" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="783" y="147" text-anchor="middle" font-size="16.2" fill="#1d4ed8">Car</text>
  <path d="M818,143 L822,143" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M822,143 l13,-11 13,11 -13,11 z" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2.5"/>
  <path d="M848,143 L852,143" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="852" y="120" width="70" height="46" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="887" y="147" text-anchor="middle" font-size="16.2" fill="#1d4ed8">Engine</text>

  <text x="835" y="230" text-anchor="middle" font-size="16.2" fill="#64748b">strongest link:</text>
  <text x="835" y="248" text-anchor="middle" font-size="16.2" fill="#64748b">part's lifetime is</text>
  <text x="835" y="264" text-anchor="middle" font-size="16.2" fill="#64748b">tied to the whole</text>

  <text x="490" y="325" text-anchor="middle" font-size="18.9" fill="#1d4ed8" font-weight="600">four strengths of class relations, weakest to strongest</text>
</svg>
