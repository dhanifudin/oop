<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <rect x="40" y="20" width="330" height="250" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="205" y="58" text-anchor="middle" font-size="24" font-weight="700" fill="#1d4ed8">overriding</text>
  <text x="205" y="98" text-anchor="middle" font-size="16" fill="#334155">same method signature</text>
  <text x="205" y="122" text-anchor="middle" font-size="16" fill="#334155">subclass replaces behavior</text>
  <text x="205" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#1d4ed8">resolved at runtime</text>
  <rect x="70" y="200" width="270" height="50" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="205" y="222" text-anchor="middle" font-size="14" fill="#1d4ed8">canWithdraw(double)</text>
  <text x="205" y="240" text-anchor="middle" font-size="13" fill="#334155">overridden in SavingsAccount</text>

  <g filter="url(#softShadow)">
    <rect x="430" y="20" width="330" height="250" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  </g>
  <text x="595" y="58" text-anchor="middle" font-size="24" font-weight="700" fill="#16a34a">overloading</text>
  <text x="595" y="98" text-anchor="middle" font-size="16" fill="#334155">same method name</text>
  <text x="595" y="122" text-anchor="middle" font-size="16" fill="#334155">different parameter list</text>
  <text x="595" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#16a34a">resolved at compile-time</text>
  <rect x="460" y="200" width="270" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="595" y="222" text-anchor="middle" font-size="14" fill="#16a34a">deposit(amount)</text>
  <text x="595" y="240" text-anchor="middle" font-size="13" fill="#334155">vs deposit(amount, note)</text>

  <text x="400" y="305" text-anchor="middle" font-size="17" fill="#64748b">similar-sounding names, two very different mechanisms</text>
</svg>
