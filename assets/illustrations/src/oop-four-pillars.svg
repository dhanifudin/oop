<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- roof -->
  <path d="M50,120 L410,40 L770,120 L720,120 L410,55 L100,120 Z" fill="#1d4ed8"/>
  <rect x="50" y="112" width="720" height="18" rx="4" fill="#1d4ed8"/>
  <text x="410" y="85" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">OOP</text>

  <!-- four pillars -->
  <g filter="url(#softShadow)">
    <rect x="50" y="140" width="170" height="200" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="135" y="230" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">Encapsulation</text>
  <text x="135" y="255" text-anchor="middle" font-size="14" fill="#475569">data hidden,</text>
  <text x="135" y="270" text-anchor="middle" font-size="14" fill="#475569">accessed only</text>
  <text x="135" y="285" text-anchor="middle" font-size="14" fill="#475569">through methods</text>

  <g filter="url(#softShadow)">
    <rect x="230" y="140" width="170" height="200" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="315" y="230" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">Inheritance</text>
  <text x="315" y="255" text-anchor="middle" font-size="14" fill="#475569">a class reuses</text>
  <text x="315" y="270" text-anchor="middle" font-size="14" fill="#475569">and extends</text>
  <text x="315" y="285" text-anchor="middle" font-size="14" fill="#475569">another class</text>

  <g filter="url(#softShadow)">
    <rect x="410" y="140" width="170" height="200" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="495" y="230" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">Polymorphism</text>
  <text x="495" y="255" text-anchor="middle" font-size="14" fill="#475569">one message,</text>
  <text x="495" y="270" text-anchor="middle" font-size="14" fill="#475569">many object-specific</text>
  <text x="495" y="285" text-anchor="middle" font-size="14" fill="#475569">responses</text>

  <g filter="url(#softShadow)">
    <rect x="590" y="140" width="170" height="200" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="675" y="230" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">Abstraction</text>
  <text x="675" y="255" text-anchor="middle" font-size="14" fill="#475569">only essential</text>
  <text x="675" y="270" text-anchor="middle" font-size="14" fill="#475569">details are exposed</text>
  <text x="675" y="285" text-anchor="middle" font-size="14" fill="#475569">to the outside</text>

  <!-- foundation -->
  <rect x="50" y="355" width="720" height="16" rx="4" fill="#94a3b8"/>
  <text x="410" y="398" text-anchor="middle" font-size="17.6" fill="#64748b">four ideas that together define the object-oriented style</text>
</svg>
