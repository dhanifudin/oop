<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowHollow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
    </marker>
  </defs>

  <g filter="url(#softShadow)">
    <rect x="270" y="30" width="160" height="60" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="350" y="65" text-anchor="middle" font-size="21.6" font-weight="700" fill="#1d4ed8">Animal</text>

  <path d="M350,90 L350,150" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowHollow)"/>
  <path d="M350,150 L160,150 L160,190" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowHollow)"/>
  <path d="M350,150 L540,150 L540,190" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowHollow)"/>

  <g filter="url(#softShadow)">
    <rect x="80" y="190" width="160" height="60" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="160" y="225" text-anchor="middle" font-size="21.6" font-weight="700" fill="#1d4ed8">Dog</text>

  <g filter="url(#softShadow)">
    <rect x="460" y="190" width="160" height="60" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="540" y="225" text-anchor="middle" font-size="21.6" font-weight="700" fill="#1d4ed8">Cat</text>

  <text x="160" y="290" text-anchor="middle" font-size="17.6" fill="#64748b">a Dog IS-A Animal</text>
  <text x="540" y="290" text-anchor="middle" font-size="17.6" fill="#64748b">a Cat IS-A Animal</text>

  <text x="350" y="345" text-anchor="middle" font-size="18.9" fill="#1d4ed8" font-weight="600">the hollow arrow always points from child up to parent</text>
</svg>
