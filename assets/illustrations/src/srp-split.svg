<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- LEFT: one class, three responsibilities -->
  <g filter="url(#softShadow)">
    <rect x="60" y="40" width="300" height="300" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2"/>
  </g>
  <text x="210" y="76" text-anchor="middle" font-size="19.8" font-weight="700" fill="#991b1b">Report</text>
  <rect x="85" y="95" width="250" height="55" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
  <text x="210" y="127" text-anchor="middle" font-size="15.4" fill="#991b1b">calculate totals</text>
  <rect x="85" y="160" width="250" height="55" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
  <text x="210" y="192" text-anchor="middle" font-size="15.4" fill="#991b1b">format as text</text>
  <rect x="85" y="225" width="250" height="55" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
  <text x="210" y="257" text-anchor="middle" font-size="15.4" fill="#991b1b">send by email</text>
  <text x="210" y="322" text-anchor="middle" font-size="15.4" fill="#991b1b">one class, three reasons to change</text>

  <path d="M375,190 L430,190" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrowGray)"/>

  <!-- RIGHT: split into three focused classes -->
  <rect x="450" y="40" width="240" height="80" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2"/>
  <text x="570" y="72" text-anchor="middle" font-size="16.9" font-weight="700" fill="#166534">TotalCalculator</text>
  <text x="570" y="96" text-anchor="middle" font-size="14.1" fill="#166534">calculate totals</text>

  <rect x="450" y="140" width="240" height="80" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2"/>
  <text x="570" y="172" text-anchor="middle" font-size="16.9" font-weight="700" fill="#166534">ReportFormatter</text>
  <text x="570" y="196" text-anchor="middle" font-size="14.1" fill="#166534">format as text</text>

  <rect x="450" y="240" width="240" height="80" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2"/>
  <text x="570" y="272" text-anchor="middle" font-size="16.9" font-weight="700" fill="#166534">ReportMailer</text>
  <text x="570" y="296" text-anchor="middle" font-size="14.1" fill="#166534">send by email</text>

  <text x="570" y="345" text-anchor="middle" font-size="15.4" fill="#166534">three classes, each with one reason to change</text>

  <text x="450" y="410" text-anchor="middle" font-size="16.9" fill="#94a3b8">Single Responsibility Principle: one class, one reason to change</text>
</svg>
