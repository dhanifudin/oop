<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowBlue6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- left: the GUI, a small calculator with a "+" button -->
  <g filter="url(#softShadow)">
    <rect x="40" y="90" width="200" height="180" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
  </g>
  <rect x="60" y="110" width="160" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="140" y="136" text-anchor="middle" font-size="17.6" fill="#64748b">12</text>
  <rect x="60" y="165" width="70" height="45" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="95" y="193" text-anchor="middle" font-size="16.9" fill="#1d4ed8">7</text>
  <rect x="150" y="165" width="70" height="45" rx="8" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="185" y="193" text-anchor="middle" font-size="19.8" font-weight="700" fill="#ffffff">+</text>
  <text x="140" y="248" text-anchor="middle" font-size="15.4" fill="#64748b">Calculator GUI</text>

  <path d="M245,190 L305,190" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowBlue6)"/>
  <text x="275" y="172" text-anchor="middle" font-size="14.5" fill="#64748b">user clicks</text>

  <!-- middle: event fired -->
  <g filter="url(#softShadow)">
    <rect x="310" y="150" width="220" height="80" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2"/>
  </g>
  <text x="420" y="182" text-anchor="middle" font-size="17.6" font-weight="700" fill="#991b1b">ActionEvent</text>
  <text x="420" y="206" text-anchor="middle" font-size="15.4" fill="#991b1b">fired by the button</text>

  <path d="M535,190 L580,190" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowBlue6)"/>
  <text x="558" y="172" text-anchor="middle" font-size="14.5" fill="#64748b">triggers</text>

  <!-- right: handler runs -->
  <g filter="url(#softShadow)">
    <rect x="585" y="130" width="290" height="120" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2"/>
  </g>
  <text x="730" y="160" text-anchor="middle" font-size="16.9" font-weight="700" fill="#166534">plusButtonActionPerformed()</text>
  <text x="730" y="188" text-anchor="middle" font-size="15.4" fill="#166534">result = a + b;</text>
  <text x="730" y="210" text-anchor="middle" font-size="15.4" fill="#166534">display.setText(result);</text>

  <text x="450" y="330" text-anchor="middle" font-size="16.9" fill="#94a3b8">the handler does not run in a fixed sequence,</text>
  <text x="450" y="354" text-anchor="middle" font-size="16.9" fill="#94a3b8">it waits and runs only when its event actually happens</text>
</svg>
