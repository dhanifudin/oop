<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadowWin" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1e293b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#softShadowWin)">
    <rect x="20" y="20" width="600" height="420" rx="6" fill="#eceff1" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <rect x="20" y="20" width="600" height="30" rx="6" fill="#cbd5e1"/>
  <rect x="20" y="38" width="600" height="12" fill="#cbd5e1"/>
  <text x="320" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Bank Mini</text>

  <!-- table -->
  <rect x="40" y="66" width="560" height="180" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="40" y="66" width="560" height="28" fill="#e2e8f0"/>
  <text x="55" y="85" font-size="13" font-weight="700" fill="#334155">Account Number</text>
  <text x="270" y="85" font-size="13" font-weight="700" fill="#334155">Owner</text>
  <text x="440" y="85" font-size="13" font-weight="700" fill="#334155">Balance</text>
  <line x1="250" y1="66" x2="250" y2="246" stroke="#cbd5e1"/>
  <line x1="420" y1="66" x2="420" y2="246" stroke="#cbd5e1"/>

  <!-- selected row -->
  <rect x="41" y="94" width="558" height="30" fill="#bfdbfe"/>
  <text x="55" y="114" font-size="13" fill="#1e293b">A001</text>
  <text x="270" y="114" font-size="13" fill="#1e293b">Nadia</text>
  <text x="440" y="114" font-size="13" fill="#1e293b">500000.0</text>

  <text x="55" y="144" font-size="13" fill="#1e293b">A002</text>
  <text x="270" y="144" font-size="13" fill="#1e293b">Sari</text>
  <text x="440" y="144" font-size="13" fill="#1e293b">200000.0</text>

  <text x="55" y="174" font-size="13" fill="#1e293b">A003</text>
  <text x="270" y="174" font-size="13" fill="#1e293b">Rian</text>
  <text x="440" y="174" font-size="13" fill="#1e293b">100000.0</text>

  <!-- buttons row -->
  <rect x="40" y="392" width="128" height="32" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="104" y="413" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">Add Account...</text>

  <rect x="176" y="392" width="110" height="32" rx="4" fill="#1d4ed8"/>
  <text x="231" y="413" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Deposit...</text>

  <rect x="294" y="392" width="118" height="32" rx="4" fill="#1d4ed8"/>
  <text x="353" y="413" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Withdraw...</text>

  <rect x="530" y="392" width="90" height="32" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="575" y="413" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">Refresh</text>
</svg>
