<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowGray6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- LEFT: one method, must be edited for every new type -->
  <g filter="url(#softShadow)">
    <rect x="40" y="40" width="360" height="300" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2"/>
  </g>
  <text x="220" y="76" text-anchor="middle" font-size="19.8" font-weight="700" fill="#991b1b">PaymentMethod.pay()</text>

  <rect x="65" y="95" width="310" height="55" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
  <text x="220" y="127" text-anchor="middle" font-size="14.5" fill="#991b1b">if (instanceof CreditCard) ...</text>

  <rect x="65" y="160" width="310" height="55" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
  <text x="220" y="192" text-anchor="middle" font-size="14.5" fill="#991b1b">else if (instanceof BankTransfer) ...</text>

  <rect x="65" y="225" width="310" height="55" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="220" y="257" text-anchor="middle" font-size="14.5" fill="#64748b">else if (instanceof GoPay) ... ?</text>

  <text x="220" y="312" text-anchor="middle" font-size="15.4" fill="#991b1b">must edit this method for</text>
  <text x="220" y="334" text-anchor="middle" font-size="15.4" fill="#991b1b">every new payment type</text>

  <path d="M405,190 L455,190" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrowGray6)"/>

  <!-- RIGHT: subclasses, new one added without touching old code -->
  <rect x="475" y="40" width="240" height="60" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.2"/>
  <text x="595" y="65" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">PaymentMethod</text>
  <text x="595" y="87" text-anchor="middle" font-size="13.5" fill="#1d4ed8">pay()</text>

  <rect x="475" y="140" width="240" height="60" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2"/>
  <text x="595" y="165" text-anchor="middle" font-size="15.4" font-weight="700" fill="#166534">CreditCard</text>
  <text x="595" y="187" text-anchor="middle" font-size="13" fill="#166534">overrides pay()</text>

  <rect x="475" y="215" width="240" height="60" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2"/>
  <text x="595" y="240" text-anchor="middle" font-size="15.4" font-weight="700" fill="#166534">BankTransfer</text>
  <text x="595" y="262" text-anchor="middle" font-size="13" fill="#166534">overrides pay()</text>

  <rect x="475" y="290" width="240" height="60" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.4"/>
  <text x="595" y="315" text-anchor="middle" font-size="15.4" font-weight="700" fill="#166534">GoPay (new)</text>
  <text x="595" y="337" text-anchor="middle" font-size="13" fill="#166534">overrides pay()</text>

  <path d="M595,102 L595,138" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowGray6)"/>
  <path d="M595,102 C540,150 540,240 590,213" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowGray6)"/>
  <path d="M595,102 C660,180 660,260 600,288" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowGray6)"/>

  <text x="595" y="400" text-anchor="middle" font-size="15.4" fill="#166534">GoPay added without touching</text>
  <text x="595" y="422" text-anchor="middle" font-size="15.4" fill="#166534">PaymentMethod or existing subclasses</text>
</svg>
