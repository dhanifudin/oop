<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- the object card -->
  <g filter="url(#softShadow)">
    <rect x="260" y="150" width="240" height="150" rx="16" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="380" y="183" text-anchor="middle" font-size="21.6" font-weight="700" fill="#1d4ed8">the object being built</text>
  <line x1="285" y1="198" x2="475" y2="198" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="285" y="230" font-size="20.2" fill="#0f172a">this.width</text>
  <text x="285" y="265" font-size="18.9" fill="#7c3aed" font-weight="700">&#8592; the object's own field</text>

  <!-- incoming parameter arrow, from outside -->
  <path d="M150,115 C195,130 225,148 258,170" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <text x="90" y="60" text-anchor="middle" font-size="20.2" font-weight="700" fill="#ea580c">width</text>
  <text x="90" y="80" text-anchor="middle" font-size="17.6" fill="#ea580c">the parameter,</text>
  <text x="90" y="97" text-anchor="middle" font-size="15.5" fill="#ea580c">arrives from outside</text>

  <!-- self-referencing curved arrow labeled "this", looped clear below the label text -->
  <path d="M500,240 C610,240 620,340 500,345 C440,347 415,325 405,303"
        fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <text x="558" y="200" text-anchor="middle" font-size="23" font-weight="700" fill="#7c3aed">this</text>
  <text x="558" y="220" text-anchor="middle" font-size="16.2" fill="#7c3aed">refers back to</text>
  <text x="558" y="236" text-anchor="middle" font-size="16.2" fill="#7c3aed">the object itself</text>

  <text x="380" y="382" text-anchor="middle" font-size="18.9" fill="#94a3b8">same name, two different things:</text>
  <text x="380" y="404" text-anchor="middle" font-size="18.9" fill="#94a3b8">this.width is the field, width is the parameter</text>
</svg>
