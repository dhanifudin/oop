<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowRed8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- LEFT: direct dependency on concrete class -->
  <text x="215" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">before</text>

  <rect x="90" y="55" width="250" height="60" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.2"/>
  <text x="215" y="91" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">OrderProcessor</text>

  <path d="M215,115 L215,168" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed8)"/>

  <rect x="90" y="173" width="250" height="60" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.4"/>
  <text x="215" y="209" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">MySqlDatabase</text>

  <text x="215" y="265" text-anchor="middle" font-size="14.5" fill="#991b1b">tightly coupled,</text>
  <text x="215" y="287" text-anchor="middle" font-size="14.5" fill="#991b1b">can't swap or test</text>

  <line x1="450" y1="20" x2="450" y2="380" stroke="#e2e8f0" stroke-width="2"/>

  <!-- RIGHT: depends on interface, implementations plug in -->
  <text x="685" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">after</text>

  <rect x="560" y="55" width="250" height="60" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.2"/>
  <text x="685" y="91" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">OrderProcessor</text>

  <path d="M685,115 L685,158" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowGreen8)"/>

  <rect x="560" y="163" width="250" height="55" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.4"/>
  <text x="685" y="184" text-anchor="middle" font-size="15.4" font-weight="700" fill="#166534">Repository</text>
  <text x="685" y="204" text-anchor="middle" font-size="12.5" fill="#166534">(interface)</text>

  <path d="M630,255 C630,235 650,225 660,222" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowGreen8)"/>
  <path d="M750,255 C750,235 730,225 715,222" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowGreen8)"/>

  <rect x="530" y="260" width="190" height="55" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="625" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">MySqlDatabase</text>

  <rect x="730" y="260" width="150" height="55" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="805" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">MockRepository</text>

  <text x="685" y="350" text-anchor="middle" font-size="14.5" fill="#166534">implementation swappable,</text>
  <text x="685" y="372" text-anchor="middle" font-size="14.5" fill="#166534">testable without a real database</text>
</svg>
