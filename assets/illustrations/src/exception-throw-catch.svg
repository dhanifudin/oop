<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- caller -->
  <g filter="url(#softShadow)">
    <rect x="150" y="20" width="500" height="70" rx="14" fill="#1d4ed8"/>
  </g>
  <text x="400" y="48" text-anchor="middle" font-size="18.5" font-weight="700" fill="#ffffff">try {</text>
  <text x="400" y="74" text-anchor="middle" font-size="18.5" font-weight="700" fill="#ffffff">thermostat.setTemperature(-50);</text>

  <path d="M400,92 L400,138" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>

  <!-- thrown, inside setTemperature -->
  <g filter="url(#softShadow)">
    <rect x="110" y="143" width="580" height="100" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2"/>
  </g>
  <text x="400" y="172" text-anchor="middle" font-size="18.5" font-weight="700" fill="#991b1b">inside setTemperature(-50):</text>
  <text x="400" y="198" text-anchor="middle" font-size="17.1" fill="#991b1b">throw new InvalidTemperatureException(...)</text>
  <text x="400" y="222" text-anchor="middle" font-size="15.4" fill="#b91c1c">the rest of the method never runs</text>

  <path d="M400,246 L400,292" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,5" marker-end="url(#arrowGreen)"/>
  <text x="440" y="272" text-anchor="start" font-size="14.9" fill="#94a3b8">propagates upward</text>

  <!-- caught -->
  <g filter="url(#softShadow)">
    <rect x="110" y="297" width="580" height="100" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2"/>
  </g>
  <text x="400" y="330" text-anchor="middle" font-size="18.5" font-weight="700" fill="#166534">} catch (InvalidTemperatureException e) {</text>
  <text x="400" y="356" text-anchor="middle" font-size="17.1" fill="#166534">handle e.getMessage(), program keeps running</text>
  <text x="400" y="380" text-anchor="middle" font-size="17.1" fill="#166534">}</text>

  <text x="400" y="430" text-anchor="middle" font-size="16.9" fill="#94a3b8">an exception halts the method it occurred in and is</text>
  <text x="400" y="452" text-anchor="middle" font-size="16.9" fill="#94a3b8">passed upward until a matching catch block handles it</text>
</svg>
