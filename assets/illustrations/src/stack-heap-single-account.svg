<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowRef" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- Stack region -->
  <rect x="30" y="30" width="230" height="360" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="145" y="65" text-anchor="middle" font-size="27" font-weight="700" fill="#1d4ed8">Stack</text>
  <text x="145" y="86" text-anchor="middle" font-size="17.6" fill="#3b82f6">fast, temporary, tiny</text>

  <g filter="url(#softShadow)">
    <rect x="60" y="150" width="170" height="70" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="145" y="180" text-anchor="middle" font-size="20.2" fill="#64748b">variable</text>
  <text x="145" y="202" text-anchor="middle" font-size="24.3" font-weight="700" fill="#0f172a">acc</text>

  <!-- Heap region -->
  <rect x="360" y="30" width="310" height="360" rx="18" fill="#fefce8" stroke="#fde047" stroke-width="2"/>
  <text x="515" y="65" text-anchor="middle" font-size="27" font-weight="700" fill="#ca8a04">Heap</text>
  <text x="515" y="86" text-anchor="middle" font-size="17.6" fill="#ca8a04">bigger, lives longer</text>

  <g filter="url(#softShadow)">
    <rect x="400" y="150" width="230" height="150" rx="16" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="515" y="180" text-anchor="middle" font-size="21.6" font-weight="700" fill="#1d4ed8">Account object</text>
  <line x1="420" y1="195" x2="610" y2="195" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="420" y="222" font-size="20.2" fill="#0f172a">ownerName</text>
  <text x="610" y="222" text-anchor="end" font-size="20.2" fill="#0f172a" font-weight="600">"Nadia"</text>
  <text x="420" y="252" font-size="20.2" fill="#0f172a">balance</text>
  <text x="610" y="252" text-anchor="end" font-size="20.2" fill="#0f172a" font-weight="600">500000.0</text>
  <line x1="420" y1="268" x2="610" y2="268" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="420" y="288" font-size="17.6" fill="#94a3b8">+ deposit(), withdraw()</text>

  <!-- the reference arrow -->
  <path d="M232,185 C300,185 340,220 396,222" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrowRef)"/>
  <text x="300" y="170" text-anchor="middle" font-size="18.9" fill="#1d4ed8" font-weight="600">points to</text>

  <text x="350" y="425" text-anchor="middle" font-size="18.9" fill="#94a3b8">the variable is just an address; the real object lives in the heap</text>
</svg>
