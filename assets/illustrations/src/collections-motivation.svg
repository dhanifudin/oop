<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowRed5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- LEFT: plain array -->
  <g filter="url(#softShadow)">
    <rect x="40" y="30" width="380" height="400" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2"/>
  </g>
  <text x="230" y="66" text-anchor="middle" font-size="20.2" font-weight="700" fill="#991b1b">Employee[] (fixed size)</text>

  <rect x="70"  y="90" width="70" height="55" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="150" y="90" width="70" height="55" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="230" y="90" width="70" height="55" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="310" y="90" width="70" height="55" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="105" y="122" text-anchor="middle" font-size="15.4" fill="#1d4ed8">[0]</text>
  <text x="185" y="122" text-anchor="middle" font-size="15.4" fill="#1d4ed8">[1]</text>
  <text x="265" y="122" text-anchor="middle" font-size="15.4" fill="#1d4ed8">[2]</text>
  <text x="345" y="122" text-anchor="middle" font-size="14.5" fill="#94a3b8">?</text>

  <text x="230" y="178" text-anchor="middle" font-size="15.4" fill="#991b1b">capacity fixed at creation,</text>
  <text x="230" y="200" text-anchor="middle" font-size="15.4" fill="#991b1b">must be guessed upfront</text>

  <text x="230" y="240" text-anchor="middle" font-size="16.9" font-weight="700" fill="#991b1b">findEmployee(&quot;E003&quot;)</text>
  <path d="M105,265 L105,290" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrowRed5)"/>
  <path d="M185,265 L185,290" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrowRed5)"/>
  <path d="M265,265 L265,290" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrowRed5)"/>
  <text x="105" y="315" text-anchor="middle" font-size="14.5" fill="#991b1b">[0] no</text>
  <text x="185" y="315" text-anchor="middle" font-size="14.5" fill="#991b1b">[1] no</text>
  <text x="265" y="315" text-anchor="middle" font-size="14.5" fill="#991b1b">[2] yes</text>
  <text x="230" y="355" text-anchor="middle" font-size="15.4" fill="#991b1b">checked one by one until found</text>
  <text x="230" y="378" text-anchor="middle" font-size="15.4" fill="#991b1b">(linear scan)</text>

  <!-- RIGHT: ArrayList + HashMap -->
  <g filter="url(#softShadow)">
    <rect x="480" y="30" width="380" height="400" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2"/>
  </g>
  <text x="670" y="66" text-anchor="middle" font-size="20.2" font-weight="700" fill="#166534">Map&lt;String, Employee&gt;</text>

  <rect x="510" y="90" width="90" height="55" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="610" y="90" width="90" height="55" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="710" y="90" width="120" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="555" y="112" text-anchor="middle" font-size="14.1" fill="#166534">&quot;E001&quot;</text>
  <text x="555" y="132" text-anchor="middle" font-size="14.1" fill="#166534">Nadia</text>
  <text x="655" y="112" text-anchor="middle" font-size="14.1" fill="#166534">&quot;E002&quot;</text>
  <text x="655" y="132" text-anchor="middle" font-size="14.1" fill="#166534">Sari</text>
  <text x="770" y="122" text-anchor="middle" font-size="14.1" fill="#16a34a">grows as needed</text>

  <text x="670" y="185" text-anchor="middle" font-size="15.4" fill="#166534">size adjusts automatically,</text>
  <text x="670" y="207" text-anchor="middle" font-size="15.4" fill="#166534">no capacity to guess</text>

  <text x="670" y="248" text-anchor="middle" font-size="16.9" font-weight="700" fill="#166534">employees.get(&quot;E003&quot;)</text>
  <path d="M670,265 C670,285 670,285 670,300" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrowGreen5)"/>
  <rect x="600" y="305" width="140" height="55" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2.4"/>
  <text x="670" y="327" text-anchor="middle" font-size="14.1" fill="#166534">&quot;E003&quot;</text>
  <text x="670" y="347" text-anchor="middle" font-size="14.1" fill="#166534">Rian</text>

  <text x="670" y="393" text-anchor="middle" font-size="15.4" fill="#166534">key maps directly to its value</text>
  <text x="670" y="415" text-anchor="middle" font-size="15.4" fill="#166534">(no scanning needed)</text>
</svg>
