<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadowDlg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1e293b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#softShadowDlg)">
    <rect x="20" y="20" width="440" height="360" rx="6" fill="#eceff1" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <rect x="20" y="20" width="440" height="34" rx="6" fill="#cbd5e1"/>
  <rect x="20" y="42" width="440" height="12" fill="#cbd5e1"/>
  <text x="240" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Add Account</text>

  <!-- form rows -->
  <text x="42" y="88" font-size="14" fill="#1e293b">Account Number:</text>
  <rect x="230" y="72" width="120" height="26" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="240" y="90" font-size="14" fill="#475569">A003</text>

  <text x="42" y="128" font-size="14" fill="#1e293b">Owner:</text>
  <rect x="230" y="112" width="210" height="26" rx="3" fill="#ffffff" stroke="#94a3b8"/>
  <text x="240" y="130" font-size="14" fill="#1e293b">Rian</text>

  <text x="42" y="168" font-size="14" fill="#1e293b">Phone:</text>
  <rect x="230" y="152" width="210" height="26" rx="3" fill="#ffffff" stroke="#94a3b8"/>
  <text x="240" y="170" font-size="14" fill="#1e293b">0812-0000-0003</text>

  <text x="42" y="208" font-size="14" fill="#1e293b">Type:</text>
  <rect x="230" y="192" width="150" height="26" rx="3" fill="#ffffff" stroke="#94a3b8"/>
  <text x="240" y="210" font-size="14" fill="#1e293b">Savings</text>
  <path d="M362,199 L370,207 L378,199" fill="none" stroke="#475569" stroke-width="2"/>

  <text x="42" y="248" font-size="14" fill="#1e293b">Initial Balance:</text>
  <rect x="230" y="232" width="210" height="26" rx="3" fill="#ffffff" stroke="#94a3b8"/>
  <text x="240" y="250" font-size="14" fill="#1e293b">100000</text>

  <!-- buttons -->
  <rect x="230" y="300" width="100" height="34" rx="4" fill="#1d4ed8"/>
  <text x="280" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Save</text>

  <rect x="350" y="300" width="100" height="34" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="400" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Cancel</text>
</svg>
