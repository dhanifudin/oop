<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.16"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#1d4ed8" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowRef2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- Stack region -->
  <rect x="20" y="30" width="280" height="360" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="160" y="65" text-anchor="middle" font-size="27" font-weight="700" fill="#1d4ed8">Stack</text>

  <g filter="url(#softShadow)">
    <rect x="40" y="150" width="105" height="70" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <rect x="165" y="150" width="105" height="70" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="92" y="180" text-anchor="middle" font-size="17.6" fill="#64748b">variable</text>
  <text x="92" y="202" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">original</text>
  <text x="217" y="180" text-anchor="middle" font-size="17.6" fill="#64748b">variable</text>
  <text x="217" y="202" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">copy</text>

  <!-- Heap region -->
  <rect x="360" y="30" width="320" height="360" rx="18" fill="#fefce8" stroke="#fde047" stroke-width="2"/>
  <text x="520" y="65" text-anchor="middle" font-size="27" font-weight="700" fill="#ca8a04">Heap</text>

  <g filter="url(#glow)">
    <rect x="410" y="160" width="230" height="150" rx="16" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
  </g>
  <text x="525" y="192" text-anchor="middle" font-size="21.6" font-weight="700" fill="#1d4ed8">Rectangle object</text>
  <line x1="430" y1="205" x2="620" y2="205" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="430" y="232" font-size="20.2" fill="#0f172a">width</text>
  <text x="620" y="232" text-anchor="end" font-size="20.2" fill="#0f172a" font-weight="600">10</text>
  <text x="430" y="262" font-size="20.2" fill="#0f172a">height</text>
  <text x="620" y="262" text-anchor="end" font-size="20.2" fill="#0f172a" font-weight="600">4</text>
  <text x="525" y="292" text-anchor="middle" font-size="17.6" fill="#94a3b8">only ONE object exists</text>

  <!-- two arrows converging -->
  <path d="M92,224 C120,270 250,290 406,235" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrowRef2)"/>
  <path d="M217,224 C280,250 340,240 406,222" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrowRef2)"/>

  <text x="350" y="418" text-anchor="middle" font-size="18.9" fill="#94a3b8">two variables, one object;</text>
  <text x="350" y="440" text-anchor="middle" font-size="18.9" fill="#94a3b8">change it through either one and both see it</text>
</svg>
