<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Left panel: OOP, bundled -->
  <g filter="url(#softShadow)">
    <rect x="40" y="40" width="330" height="300" rx="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="205" y="75" text-anchor="middle" font-size="19" font-weight="700" fill="#1d4ed8">object-oriented: bundled together</text>

  <!-- state zone -->
  <rect x="70" y="100" width="270" height="90" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="90" y="122" font-size="15" fill="#64748b">state (data)</text>
  <circle cx="105" cy="155" r="10" fill="#1d4ed8"/>
  <circle cx="140" cy="155" r="10" fill="#1d4ed8"/>
  <circle cx="175" cy="155" r="10" fill="#1d4ed8"/>
  <rect x="205" y="146" width="110" height="18" rx="9" fill="#dbeafe"/>

  <!-- behavior zone -->
  <rect x="70" y="205" width="270" height="90" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="90" y="227" font-size="15" fill="#64748b">behavior (methods)</text>
  <path d="M100,260 a12,12 0 1,1 0.1,0" fill="none" stroke="#16a34a" stroke-width="3"/>
  <circle cx="100" cy="260" r="4" fill="#16a34a"/>
  <path d="M140,260 a12,12 0 1,1 0.1,0" fill="none" stroke="#16a34a" stroke-width="3"/>
  <circle cx="140" cy="260" r="4" fill="#16a34a"/>
  <rect x="170" y="251" width="140" height="18" rx="9" fill="#dcfce7"/>

  <text x="205" y="325" text-anchor="middle" font-size="14" fill="#1d4ed8" font-weight="600">one object, one boundary</text>

  <!-- Right panel: procedural, scattered -->
  <g filter="url(#softShadow)">
    <rect x="450" y="40" width="330" height="300" rx="20" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  </g>
  <text x="615" y="75" text-anchor="middle" font-size="19" font-weight="700" fill="#dc2626">procedural: scattered apart</text>

  <rect x="480" y="110" width="120" height="60" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="540" y="145" text-anchor="middle" font-size="14" fill="#64748b">data</text>

  <rect x="630" y="110" width="120" height="60" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="690" y="145" text-anchor="middle" font-size="14" fill="#64748b">data</text>

  <rect x="555" y="230" width="140" height="60" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="625" y="265" text-anchor="middle" font-size="14" fill="#64748b">function</text>

  <path d="M540,170 L595,232" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M690,170 L655,232" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,4"/>

  <text x="615" y="325" text-anchor="middle" font-size="14" fill="#dc2626" font-weight="600">kept in sync by hand</text>
</svg>
