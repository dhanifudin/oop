<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowIn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowOut" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- input -->
  <text x="90" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#ea580c">parameter</text>
  <text x="90" y="120" text-anchor="middle" font-size="13" fill="#ea580c">(what you give it)</text>
  <line x1="150" y1="130" x2="270" y2="130" stroke="#ea580c" stroke-width="3" marker-end="url(#arrowIn)"/>

  <!-- the method box -->
  <g filter="url(#softShadow)">
    <rect x="280" y="70" width="200" height="120" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="380" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">method</text>
  <text x="380" y="145" text-anchor="middle" font-size="13" fill="#3b82f6">does some work</text>
  <text x="380" y="163" text-anchor="middle" font-size="13" fill="#3b82f6">with the input</text>

  <!-- output -->
  <line x1="490" y1="130" x2="610" y2="130" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowOut)"/>
  <text x="670" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a">return value</text>
  <text x="670" y="120" text-anchor="middle" font-size="13" fill="#16a34a">(what you get back)</text>

  <text x="380" y="230" text-anchor="middle" font-size="14" fill="#94a3b8">a method can take input and hand back a result, like a small machine</text>
</svg>
