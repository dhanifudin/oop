<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- Left: procedural, one shared data pile, many functions poking at it -->
  <g filter="url(#softShadow)">
    <rect x="40" y="40" width="340" height="330" rx="20" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  </g>
  <text x="210" y="72" text-anchor="middle" font-size="18" font-weight="700" fill="#dc2626">procedural</text>

  <rect x="140" y="95" width="140" height="70" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="210" y="135" text-anchor="middle" font-size="14" fill="#64748b">shared data</text>

  <rect x="70" y="230" width="110" height="46" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="125" y="258" text-anchor="middle" font-size="13" fill="#64748b">function A</text>

  <rect x="200" y="230" width="110" height="46" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="255" y="258" text-anchor="middle" font-size="13" fill="#64748b">function B</text>

  <rect x="135" y="305" width="140" height="46" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="205" y="333" text-anchor="middle" font-size="13" fill="#64748b">function C</text>

  <path d="M170,230 L190,166" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowGray)"/>
  <path d="M250,230 L230,166" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowGray)"/>
  <path d="M205,305 L210,166" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowGray)"/>

  <text x="210" y="393" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="600">any function may reach in and change the data</text>

  <!-- Right: OOP, several independent object capsules exchanging messages -->
  <g filter="url(#softShadow)">
    <rect x="480" y="40" width="340" height="330" rx="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>
  <text x="650" y="72" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">object-oriented</text>

  <circle cx="580" cy="150" r="46" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="580" y="146" text-anchor="middle" font-size="12" fill="#1d4ed8" font-weight="600">object</text>
  <text x="580" y="161" text-anchor="middle" font-size="10" fill="#64748b">data + methods</text>

  <circle cx="720" cy="150" r="46" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="720" y="146" text-anchor="middle" font-size="12" fill="#1d4ed8" font-weight="600">object</text>
  <text x="720" y="161" text-anchor="middle" font-size="10" fill="#64748b">data + methods</text>

  <circle cx="650" cy="280" r="46" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="650" y="276" text-anchor="middle" font-size="12" fill="#1d4ed8" font-weight="600">object</text>
  <text x="650" y="291" text-anchor="middle" font-size="10" fill="#64748b">data + methods</text>

  <path d="M620,165 L685,235" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M680,165 L615,235" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <text x="650" y="393" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="600">each object guards its own data, they only talk via methods</text>
</svg>
