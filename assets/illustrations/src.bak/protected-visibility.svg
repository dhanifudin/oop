<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <text x="410" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">who can access a member?</text>

  <g filter="url(#softShadow)">
    <rect x="20" y="55" width="180" height="220" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  </g>
  <text x="110" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">private</text>
  <text x="110" y="140" text-anchor="middle" font-size="12" fill="#475569">same class</text>
  <text x="110" y="160" text-anchor="middle" font-size="12" fill="#475569">only</text>

  <g filter="url(#softShadow)">
    <rect x="220" y="55" width="180" height="220" rx="14" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  </g>
  <text x="310" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#ca8a04">default</text>
  <text x="310" y="140" text-anchor="middle" font-size="12" fill="#475569">+ same package</text>

  <g filter="url(#softShadow)">
    <rect x="420" y="55" width="180" height="220" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  </g>
  <text x="510" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">protected</text>
  <text x="510" y="140" text-anchor="middle" font-size="12" fill="#475569">+ subclasses</text>
  <text x="510" y="160" text-anchor="middle" font-size="12" fill="#475569">(even in other</text>
  <text x="510" y="178" text-anchor="middle" font-size="12" fill="#475569">packages)</text>

  <g filter="url(#softShadow)">
    <rect x="620" y="55" width="180" height="220" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  </g>
  <text x="710" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">public</text>
  <text x="710" y="140" text-anchor="middle" font-size="12" fill="#475569">+ anyone,</text>
  <text x="710" y="158" text-anchor="middle" font-size="12" fill="#475569">anywhere</text>

  <text x="410" y="310" text-anchor="middle" font-size="13" fill="#64748b">each level to the right widens access; protected sits between default and public</text>
</svg>
