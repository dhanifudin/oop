<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d4ed8" flood-opacity="0.18"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- the cutter / mold -->
  <g filter="url(#softShadow)">
    <path d="M340,20 L460,20 L480,70 L460,120 L340,120 L320,70 Z"
          fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
  </g>
  <text x="400" y="75" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">class</text>

  <!-- stamping arrow -->
  <line x1="400" y1="128" x2="400" y2="180" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <!-- three objects, same shape, different fills -->
  <g filter="url(#softShadow)">
    <rect x="90" y="200" width="180" height="150" rx="16" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <rect x="310" y="200" width="180" height="150" rx="16" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <rect x="530" y="200" width="180" height="150" rx="16" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>

  <!-- three converging arrows from the cutter -->
  <path d="M370,132 C300,150 220,170 180,198" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <path d="M400,132 L400,198" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <path d="M430,132 C500,150 580,170 620,198" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- object 1 fill: warm -->
  <circle cx="140" cy="250" r="14" fill="#fbbf24"/>
  <circle cx="180" cy="250" r="14" fill="#fb923c"/>
  <rect x="115" y="285" width="130" height="12" rx="6" fill="#fef3c7"/>
  <rect x="115" y="305" width="90" height="12" rx="6" fill="#fef3c7"/>

  <!-- object 2 fill: green -->
  <circle cx="360" cy="250" r="14" fill="#22c55e"/>
  <circle cx="400" cy="250" r="14" fill="#4ade80"/>
  <rect x="335" y="285" width="130" height="12" rx="6" fill="#dcfce7"/>
  <rect x="335" y="305" width="110" height="12" rx="6" fill="#dcfce7"/>

  <!-- object 3 fill: pink -->
  <circle cx="580" cy="250" r="14" fill="#ec4899"/>
  <circle cx="620" cy="250" r="14" fill="#f472b6"/>
  <rect x="555" y="285" width="130" height="12" rx="6" fill="#fce7f3"/>
  <rect x="555" y="305" width="70" height="12" rx="6" fill="#fce7f3"/>

  <text x="180" y="380" text-anchor="middle" font-size="17" fill="#64748b">object</text>
  <text x="400" y="380" text-anchor="middle" font-size="17" fill="#64748b">object</text>
  <text x="620" y="380" text-anchor="middle" font-size="17" fill="#64748b">object</text>

  <text x="400" y="410" text-anchor="middle" font-size="15" fill="#94a3b8">one class, many objects, each keeping its own data</text>
</svg>
