<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kuis Bank Mini - Pertemuan 1-4</title>
<link rel="stylesheet" href="quiz.css" />
</head>
<body>

<div id="app">

  <header id="app-header">
    <h1>Kuis Bank Mini</h1>
    <p class="subtitle">Pemrograman Berbasis Objek &middot; Pertemuan 1-4</p>
  </header>

  <section id="screen-start" class="screen">
    <div class="card">
      <h2>Mulai Sesi Kuis</h2>

      <div class="field">
        <label for="input-count">Jumlah soal</label>
        <input type="number" id="input-count" min="1" max="48" value="20" />
      </div>

      <fieldset class="field">
        <legend>Pertemuan yang disertakan</legend>
        <label class="checkbox"><input type="checkbox" class="meeting-filter" value="1" checked /> Pertemuan 1</label>
        <label class="checkbox"><input type="checkbox" class="meeting-filter" value="2" checked /> Pertemuan 2</label>
        <label class="checkbox"><input type="checkbox" class="meeting-filter" value="3" checked /> Pertemuan 3</label>
        <label class="checkbox"><input type="checkbox" class="meeting-filter" value="4" checked /> Pertemuan 4</label>
      </fieldset>

      <p id="start-error" class="error" hidden></p>

      <button id="btn-start" class="btn btn-primary btn-large">Mulai Kuis</button>
    </div>
  </section>

  <section id="screen-question" class="screen" hidden>
    <div class="q-meta">
      <span id="badge-meeting" class="badge badge-meeting"></span>
      <span id="badge-format" class="badge"></span>
      <span id="badge-difficulty" class="badge"></span>
      <span id="progress-label" class="progress-label"></span>
    </div>

    <div class="timer-wrap">
      <div id="timer-number" class="timer-number"></div>
      <div id="timer-bar" class="timer-bar"></div>
    </div>

    <div id="question-body" class="question-body"></div>

    <div class="answer-area">
      <p class="answer-hint">Jawab dalam hati atau di kertas sebelum waktu habis.</p>
    </div>

    <div id="answer-box" class="answer-box" hidden>
      <div class="answer-label">Jawaban</div>
      <div id="answer-html"></div>
    </div>

    <div id="explanation-box" class="explanation-box" hidden>
      <div class="explanation-label">Penjelasan</div>
      <div id="explanation-html"></div>
    </div>

    <div class="controls">
      <button id="btn-timer-minus" class="btn btn-ghost" title="Kurangi 10 detik (tombol -)">-10s</button>
      <button id="btn-pause" class="btn btn-ghost" title="Jeda/Lanjut (tombol P)">Jeda</button>
      <button id="btn-timer-plus" class="btn btn-ghost" title="Tambah 10 detik (tombol +)">+10s</button>
      <button id="btn-reveal" class="btn btn-primary" title="Tampilkan jawaban (tombol Spasi)">Tampilkan Jawaban</button>
      <button id="btn-next" class="btn btn-primary" title="Soal berikutnya (tombol Spasi)">Soal Berikutnya</button>
      <button id="btn-restart" class="btn btn-ghost" title="Mulai ulang sesi (tombol R)">Ulangi Sesi</button>
    </div>
  </section>

  <section id="screen-end" class="screen" hidden>
    <div class="card">
      <h2>Kuis Selesai</h2>
      <p>Terima kasih! Sesi kuis untuk Pertemuan 1-4 sudah selesai.</p>
      <button id="btn-restart-end" class="btn btn-primary btn-large">Mulai Sesi Baru</button>
    </div>
  </section>

</div>

<script src="quiz.js"></script>
</body>
</html>
