<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kuis OOP</title>
<link rel="stylesheet" href="quiz.css" />
</head>
<body>

<div id="app">

  <section id="screen-start" class="screen">
    <div class="card">
      <h2>Mulai Sesi Kuis</h2>

      <div class="field">
        <label for="input-count">Jumlah soal</label>
        <input type="number" id="input-count" min="1" max="25" value="25" />
      </div>

      <fieldset class="field">
        <legend>Kelompok soal yang disertakan</legend>
        <label class="checkbox"><input type="checkbox" class="meeting-filter" value="1" checked /> Kelompok 1</label>
        <label class="checkbox"><input type="checkbox" class="meeting-filter" value="2" checked /> Kelompok 2</label>
        <label class="checkbox"><input type="checkbox" class="meeting-filter" value="3" checked /> Kelompok 3</label>
        <label class="checkbox"><input type="checkbox" class="meeting-filter" value="4" checked /> Kelompok 4</label>
      </fieldset>

      <p id="estimate-label" class="estimate-label"></p>

      <p id="start-error" class="error" hidden></p>

      <button id="btn-start" class="btn btn-primary btn-large">Mulai Kuis</button>
    </div>
  </section>

  <section id="screen-question" class="screen" hidden>
    <div class="timer-wrap">
      <div id="nav-strip" class="nav-strip"></div>
      <div class="timer-readout">
        <span id="progress-label" class="progress-label"></span>
        <div class="timer-actions">
          <button id="btn-timer-minus" class="btn btn-ghost btn-compact" title="Kurangi 10 detik">-10s</button>
          <button id="btn-pause" class="btn btn-ghost btn-compact" title="Jeda/Lanjut (tombol P)">Jeda</button>
          <button id="btn-timer-plus" class="btn btn-ghost btn-compact" title="Tambah 10 detik">+10s</button>
          <button id="btn-reveal" class="btn btn-primary btn-compact" title="Tampilkan jawaban (tombol Spasi)">Tampilkan Jawaban</button>
          <button id="btn-next" class="btn btn-primary btn-compact" title="Soal berikutnya (tombol Spasi)">Soal Berikutnya</button>
          <button id="btn-restart" class="btn btn-ghost btn-compact" title="Mulai ulang sesi (tombol R)">Ulangi Sesi</button>
        </div>
        <div id="timer-number" class="timer-number"></div>
      </div>
      <div id="timer-bar" class="timer-bar"></div>
    </div>

    <div id="question-body" class="question-body"></div>

    <div id="reasoning-hint" class="reasoning-hint" hidden></div>

    <div class="answer-area">
      <p class="answer-hint">Tulis jawabanmu di kertas sebelum waktu habis.</p>
    </div>

    <div id="answer-box" class="answer-box" hidden>
      <div class="answer-label">Jawaban</div>
      <div id="answer-html"></div>
    </div>

    <div id="explanation-box" class="explanation-box" hidden>
      <div class="explanation-label">Penjelasan</div>
      <div id="explanation-html"></div>
    </div>
  </section>

  <section id="screen-end" class="screen" hidden>
    <div class="card">
      <h2>Kuis Selesai</h2>
      <p>Terima kasih! Sesi kuis sudah selesai.</p>
      <button id="btn-restart-end" class="btn btn-primary btn-large">Mulai Sesi Baru</button>
    </div>
  </section>

</div>

<script src="quiz.js"></script>
</body>
</html>
